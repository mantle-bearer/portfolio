<!-- Portfolio Template -->
{% block portfolio %}
{% extends "base.html" %}
{% block content %}
<h2>My Portfolio</h2>
<div class="portfolio-grid">
    {% for project in projects %}
    <div class="portfolio-item">
        <img src="{{ project.image_url }}" alt="{{ project.title }}">
        <h3>{{ project.title }}</h3>
        <p>{{ project.description }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
{% endblock %}
