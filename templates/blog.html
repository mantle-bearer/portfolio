{% block blog %}
{% extends "base.html" %}
{% block content %}
<h2>Blog</h2>
<div class="blog-posts">
    {% for post in posts %}
    <div class="blog-post">
        <img src="{{ post.image_url }}" alt="{{ post.title }}">
        <h3>{{ post.title }}</h3>
        <p>{{ post.content[:200] }}...</p>
        <a href="#">Read more</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
{% endblock %}
