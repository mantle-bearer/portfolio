{% extends "base.html" %}

{% block content %}
<h2>Admin Login</h2>
<form method="POST">
    {{ form.hidden_tag() }}
    
    <label for="username">Username:</label>
    {{ form.username(class="form-control") }}
    
    <label for="password">Password:</label>
    {{ form.password(class="form-control") }}
    
    <button type="submit" class="btn btn-primary">Login</button>
</form>
{% endblock %}
