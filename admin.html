<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 800px; margin: 0 auto; }
    .section { border: 1px solid #ccc; padding: 1.5rem; margin-bottom: 2rem; border-radius: 8px; }
    h2 { margin-top: 0; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
    input, textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { padding: 0.75rem 1.5rem; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #333; }
    #login-error { color: red; margin-top: 1rem; }
    .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
  </style>
</head>
<body>

  <div id="login-section" class="section" style="display:none; max-width: 400px; margin: 4rem auto;">
    <h2>Admin Login</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit">Login</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="admin-section" style="display:none;">
    <div class="header-actions">
      <h1>Content Management</h1>
      <button id="logout-btn">Logout</button>
    </div>

    <form id="admin-form">
      <div class="section">
        <h2>Profile Details</h2>
        <div class="form-group">
          <label>Header Name</label>
          <input type="text" name="header_name" placeholder="Goodluck Igbokwe">
        </div>
        <div class="form-group">
          <label>Header Role</label>
          <input type="text" name="header_role" placeholder="FullStack Developer">
        </div>
        <div class="form-group">
          <label>Home Section Name</label>
          <input type="text" name="home_name" placeholder="Goodluck Igbokwe">
        </div>
        <div class="form-group">
          <label>Home Section Role</label>
          <input type="text" name="home_role" placeholder="Junior Software Engineer">
        </div>
        <div class="form-group">
          <label>Resume URL</label>
          <input type="text" name="home_resume_url" placeholder="./other_files/Goodluck-Igbokwe-Resume.pdf">
        </div>
      </div>

      <div class="section">
        <h2>Social Links</h2>
        <div class="form-group">
          <label>LinkedIn URL</label>
          <input type="text" name="contact_linkedin">
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="contact_email">
        </div>
        <div class="form-group">
          <label>Instagram URL</label>
          <input type="text" name="contact_instagram">
        </div>
        <div class="form-group">
          <label>WhatsApp URL</label>
          <input type="text" name="contact_whatsapp">
        </div>
        <div class="form-group">
          <label>GitHub URL</label>
          <input type="text" name="contact_github">
        </div>
      </div>

      <div class="section">
        <h2>About Section</h2>
        <div class="form-group">
          <label>Years of Experience</label>
          <input type="text" name="about_experience_years" placeholder="4+">
        </div>
        <div class="form-group">
          <label>Satisfied Clients</label>
          <input type="text" name="about_clients" placeholder="150+">
        </div>
        <div class="form-group">
          <label>Working Hours</label>
          <input type="text" name="about_hours" placeholder="110+">
        </div>
        <div class="form-group">
          <label>Awards Won</label>
          <input type="text" name="about_awards" placeholder="5+">
        </div>
        <div class="form-group">
          <label>Biography</label>
          <textarea name="about_bio" rows="4"></textarea>
        </div>
        <div class="form-group">
          <label>Contact Button Text</label>
          <input type="text" name="about_contact_text" placeholder="contact me +234 703 229 8396">
        </div>
      </div>

      <button type="submit" id="save-btn" style="width: 100%; font-size: 1.1rem; padding: 1rem;">Save Content</button>
    </form>
  </div>

  <script src="/admin-bundle.js"></script>
</body>
</html>
